#import "../fragments/message-parts.graphql"

query GetMessages(
  $count: Int = 100
  $page: Int = 1
  $lastId: Int
  $fromDateTime: String
  $reverse: Boolean = false
  $poll: Boolean = false
) {
  getMessages(
    count: $count
    page: $page
    lastId: $lastId
    fromDateTime: $fromDateTime
    reverse: $reverse
    poll: $poll
  ) {
    ...MessageParts
  }
}
