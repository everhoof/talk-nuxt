chat_commands:
  dice: "Бросок кубиков"
  help: "Справка по командам"
  private_help_title: "Справка по командам · Видно только вам"
  close_private_help: "Закрыть справку по командам"
  private_help_list: |-
    **Выберите тему**
    `/help roll` — бросок кубиков
    `/help help` — личная справка
  private_help_staff_list: |-
    **Выберите тему**
    `/help roll` — бросок кубиков
    `/help help` — личная справка
    `/help showhelp` — публикация справки
  private_help_roll: |-
    `/roll [dS {'|'} NdS]`

    По умолчанию — `1d20`. Если количество не указано, бросает **один кубик**. Также можно использовать `/dice`.

    **Примеры**
    `/roll d8` — один кубик с 8 гранями
    `/roll 2d6` — два кубика с 6 гранями
  private_help_help: |-
    `/help [команда]`

    Показывает справку **только вам**. Команда `/help` покажет список доступных команд.

    **Пример**
    `/help roll`
  private_help_showhelp: |-
    `/showhelp <команда>`

    Публикует инструкцию **для всех в чате**. Доступно модераторам, администраторам и ведущим.

    **Пример**
    `/showhelp roll`
  private_help_unknown: "**Неизвестная команда.** Введите `/help`, чтобы увидеть список доступных команд."
