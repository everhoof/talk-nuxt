name: cd

on:
  push:
    branches:
      - develop

jobs:
  staging-deploy:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node env
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm ci

      - name: Run linter
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Create version file
        run: |
          echo "{\"version\": $(date +%s)}" > public/version.json

      - name: Build project
        run: pnpm build

      - name: Check production SSR
        run: pnpm test

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
            SendEnv APP_DIR
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}

      - name: Tar files
        run: |
          cp .env.staging .env
          tar -czf artifacts.tgz .output .env deploy.sh ecosystem.config.cjs .nvmrc

      - name: Copy dist files
        run: |
          echo -n "$UDP_MESSAGE" >/dev/udp/$SSH_HOST/62544
          ssh staging 'mkdir -p $APP_DIR'
          scp -r artifacts.tgz deploy.sh staging:$APP_DIR
        env:
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          UDP_MESSAGE: ${{ secrets.PRODUCTION_UDP_MESSAGE }}

      - name: Run deploy script
        run: ssh staging 'cd $APP_DIR && bash deploy.sh'
        env:
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
